services:
  postgres:
    image: postgres:16
    ports:
      - "55446:5432"
    environment:
      POSTGRES_USER: agentstudio
      POSTGRES_PASSWORD: agentstudio
      POSTGRES_DB: agentstudio
    volumes:
      - agentstudio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentstudio -d agentstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentstudio_pg:
