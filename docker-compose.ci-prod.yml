# CI-ONLY overlay for docker-compose.prod.yml.
#
# The production stack refuses the local runtime adapter, so a production smoke needs a
# Claude endpoint. This overlay points the Claude adapter at an in-network HTTP double
# instead of api.anthropic.com. It is never used by `pnpm deploy:up`.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.ci-prod.yml \
#     --env-file .env.production up -d --build

services:
  anthropic-double:
    image: node:22-alpine
    command: ['node', '/srv/mock-anthropic-api.mjs']
    working_dir: /srv
    environment:
      PORT: '8787'
    volumes:
      - ./scripts/ci:/srv:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    environment:
      ANTHROPIC_BASE_URL: http://anthropic-double:8787
    depends_on:
      anthropic-double:
        condition: service_healthy

  worker:
    environment:
      ANTHROPIC_BASE_URL: http://anthropic-double:8787
    depends_on:
      anthropic-double:
        condition: service_healthy
