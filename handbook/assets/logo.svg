<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Agent Studio">
  <defs>
    <linearGradient id="as-g" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C048C8"/>
      <stop offset="0.55" stop-color="#7A3FD0"/>
      <stop offset="1" stop-color="#4B31DA"/>
    </linearGradient>
    <linearGradient id="as-g2" x1="18" y1="20" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9B4F0"/>
      <stop offset="1" stop-color="#A89BFF"/>
    </linearGradient>
    <filter id="as-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer agent ring -->
  <circle cx="32" cy="32" r="27" stroke="url(#as-g)" stroke-width="1.5" opacity="0.35"/>
  <path d="M32 5.5a26.5 26.5 0 0 1 18.7 7.8" stroke="url(#as-g)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58.5 32a26.5 26.5 0 0 1-7.8 18.7" stroke="url(#as-g)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Neural diamond -->
  <path filter="url(#as-glow)" d="M32 14 48 32 32 50 16 32Z" stroke="url(#as-g)" stroke-width="2.25" fill="url(#as-g)" fill-opacity="0.12"/>
  <!-- Core node -->
  <circle cx="32" cy="32" r="5.5" fill="url(#as-g2)"/>
  <!-- Satellite nodes -->
  <circle cx="32" cy="18.5" r="2.4" fill="#C048C8"/>
  <circle cx="45.5" cy="32" r="2.4" fill="#7A3FD0"/>
  <circle cx="32" cy="45.5" r="2.4" fill="#4B31DA"/>
  <circle cx="18.5" cy="32" r="2.4" fill="#A03583"/>
  <!-- Links -->
  <path d="M32 24v6M38 32h6M32 38v6M26 32h-6" stroke="url(#as-g2)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
