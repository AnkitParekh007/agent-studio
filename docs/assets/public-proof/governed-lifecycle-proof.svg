<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#08111f"/>
  <rect x="32" y="30" width="1136" height="620" rx="28" fill="#0f1a2c" stroke="#315078" stroke-width="2"/>
  <text x="72" y="88" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#f8fbff">Governed Agent Lifecycle — Public Architecture Proof</text>
  <text x="74" y="126" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#aec3e1">Deterministic domain policy · local/runtime proof · no claim of a hosted production SaaS</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="72" y="182" width="150" height="224" rx="18" fill="#15243a" stroke="#41628f" stroke-width="2"/>
    <text x="94" y="222" font-size="15" fill="#7dd3fc">01 DEFINE</text>
    <text x="94" y="262" font-size="23" font-weight="700" fill="#fff">Agent v3</text>
    <text x="94" y="296" font-size="16" fill="#b9c9df">Immutable</text>
    <text x="94" y="320" font-size="16" fill="#b9c9df">version</text>
    <rect x="94" y="350" width="104" height="32" rx="16" fill="#263e63"/><text x="146" y="371" text-anchor="middle" font-size="13" fill="#d8e5f7">draft</text>

    <rect x="252" y="182" width="150" height="224" rx="18" fill="#15243a" stroke="#41628f" stroke-width="2"/>
    <text x="274" y="222" font-size="15" fill="#7dd3fc">02 REVIEW</text>
    <text x="274" y="262" font-size="23" font-weight="700" fill="#fff">Approval</text>
    <text x="274" y="296" font-size="16" fill="#b9c9df">Waiting for</text>
    <text x="274" y="320" font-size="16" fill="#b9c9df">separate review</text>
    <rect x="274" y="350" width="104" height="32" rx="16" fill="#634817"/><text x="326" y="371" text-anchor="middle" font-size="13" fill="#fde68a">pending</text>

    <rect x="432" y="182" width="150" height="224" rx="18" fill="#15243a" stroke="#41628f" stroke-width="2"/>
    <text x="454" y="222" font-size="15" fill="#7dd3fc">03 APPROVE</text>
    <text x="454" y="262" font-size="23" font-weight="700" fill="#fff">Current v3</text>
    <text x="454" y="296" font-size="16" fill="#b9c9df">v2 becomes</text>
    <text x="454" y="320" font-size="16" fill="#b9c9df">superseded</text>
    <rect x="454" y="350" width="104" height="32" rx="16" fill="#174b32"/><text x="506" y="371" text-anchor="middle" font-size="13" fill="#bbf7d0">approved</text>

    <rect x="612" y="182" width="150" height="224" rx="18" fill="#15243a" stroke="#41628f" stroke-width="2"/>
    <text x="634" y="222" font-size="15" fill="#7dd3fc">04 PROVISION</text>
    <text x="634" y="262" font-size="23" font-weight="700" fill="#fff">Attempt #2</text>
    <text x="634" y="296" font-size="16" fill="#b9c9df">Stable idempotency</text>
    <text x="634" y="320" font-size="16" fill="#b9c9df">stale callback denied</text>
    <rect x="634" y="350" width="104" height="32" rx="16" fill="#18465a"/><text x="686" y="371" text-anchor="middle" font-size="13" fill="#bae6fd">succeeded</text>

    <rect x="792" y="182" width="150" height="224" rx="18" fill="#15243a" stroke="#41628f" stroke-width="2"/>
    <text x="814" y="222" font-size="15" fill="#7dd3fc">05 PUBLISH</text>
    <text x="814" y="262" font-size="23" font-weight="700" fill="#fff">Grant</text>
    <text x="814" y="296" font-size="16" fill="#b9c9df">Only current</text>
    <text x="814" y="320" font-size="16" fill="#b9c9df">approved version</text>
    <rect x="814" y="350" width="104" height="32" rx="16" fill="#174b32"/><text x="866" y="371" text-anchor="middle" font-size="13" fill="#bbf7d0">runnable</text>

    <rect x="972" y="182" width="150" height="224" rx="18" fill="#15243a" stroke="#41628f" stroke-width="2"/>
    <text x="994" y="222" font-size="15" fill="#7dd3fc">06 ENFORCE</text>
    <text x="994" y="262" font-size="23" font-weight="700" fill="#fff">Deny stale</text>
    <text x="994" y="296" font-size="16" fill="#b9c9df">Revoked / stale /</text>
    <text x="994" y="320" font-size="16" fill="#b9c9df">terminated blocked</text>
    <rect x="994" y="350" width="104" height="32" rx="16" fill="#5c1c2c"/><text x="1046" y="371" text-anchor="middle" font-size="13" fill="#fecdd3">denied</text>

    <g stroke="#55a8ff" stroke-width="3" fill="#55a8ff">
      <line x1="225" y1="292" x2="247" y2="292"/><polygon points="247,292 239,286 239,298"/>
      <line x1="405" y1="292" x2="427" y2="292"/><polygon points="427,292 419,286 419,298"/>
      <line x1="585" y1="292" x2="607" y2="292"/><polygon points="607,292 599,286 599,298"/>
      <line x1="765" y1="292" x2="787" y2="292"/><polygon points="787,292 779,286 779,298"/>
      <line x1="945" y1="292" x2="967" y2="292"/><polygon points="967,292 959,286 959,298"/>
    </g>
  </g>

  <rect x="72" y="454" width="1050" height="124" rx="18" fill="#101f34" stroke="#2d4c73"/>
  <text x="94" y="488" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#7dd3fc">AUTHORITATIVE SECURITY BOUNDARY</text>
  <text x="94" y="522" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d1deef">Signed provisioning callbacks · freshness + replay checks · numbered retry attempts · publication grant validation</text>
  <text x="94" y="552" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d1deef">Runtime providers remain behind AgentRuntimeAdapter; governance is not tied to one model vendor.</text>

  <text x="72" y="620" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8fa8c9">Public proof of lifecycle policy. Hosted handbook is static documentation; the full control plane remains local/production-shaped.</text>
</svg>
