name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'handbook/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: handbook/package-lock.json

      - name: Install & build HonKit
        working-directory: handbook
        run: |
          npm ci
          npm run build
          touch _book/.nojekyll
          rm -f _book/.bookignore _book/package.json _book/package-lock.json _book/README-BUILD.md
          test -f _book/index.html
          echo "Built $(find _book -name '*.html' | wc -l) HTML pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: handbook/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
