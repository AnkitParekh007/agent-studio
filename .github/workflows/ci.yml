name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentstudio
          POSTGRES_PASSWORD: agentstudio
          POSTGRES_DB: agentstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentstudio -d agentstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://agentstudio:agentstudio@localhost:5432/agentstudio
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars!!
      BETTER_AUTH_URL: http://localhost:4000
      SECRETS_MASTER_KEY: ci-secrets-master-key-at-least-32-chars!!
      RUNTIME_ALLOW_LOCAL: 'true'
      DEFAULT_RUNTIME_PROVIDER: local
      API_BASE_URL: http://localhost:4000
      CONTROL_PLANE_ORIGIN: http://localhost:3000
      AGENT_RUNTIME_ORIGIN: http://localhost:3001
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      ALLOW_SELF_APPROVAL: 'false'
      METRICS_BEARER_TOKEN: ci-metrics-bearer-token
      DATA_RETENTION_DAYS: '90'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Write .env for app scripts
        run: |
          {
            echo 'NODE_ENV=development'
            echo 'DATABASE_URL=postgresql://agentstudio:agentstudio@localhost:5432/agentstudio'
            echo 'REDIS_URL=redis://localhost:6379'
            echo 'BETTER_AUTH_SECRET=ci-better-auth-secret-at-least-32-chars!!'
            echo 'BETTER_AUTH_URL=http://localhost:4000'
            echo 'SECRETS_MASTER_KEY=ci-secrets-master-key-at-least-32-chars!!'
            echo 'RUNTIME_ALLOW_LOCAL=true'
            echo 'DEFAULT_RUNTIME_PROVIDER=local'
            echo 'API_PORT=4000'
            echo 'API_BASE_URL=http://localhost:4000'
            echo 'CONTROL_PLANE_ORIGIN=http://localhost:3000'
            echo 'AGENT_RUNTIME_ORIGIN=http://localhost:3001'
            echo 'CORS_ORIGINS=http://localhost:3000,http://localhost:3001'
            echo 'ALLOW_SELF_APPROVAL=false'
            echo 'GATEWAY_RATE_LIMIT_PER_MINUTE=60'
            echo 'GATEWAY_MAX_CONCURRENT_SESSIONS=20'
            echo 'GATEWAY_SESSION_TIMEOUT_MS=900000'
            echo 'METRICS_BEARER_TOKEN=ci-metrics-bearer-token'
            echo 'DATA_RETENTION_DAYS=90'
          } > .env
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Migrate + seed
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Start API + worker
        run: |
          pnpm --filter @agent-studio/api start > /tmp/api.log 2>&1 &
          pnpm --filter @agent-studio/worker start > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"
          echo "---- api log ----"
          cat /tmp/api.log || true
          echo "---- worker log ----"
          cat /tmp/worker.log || true
          exit 1
      - name: Smoke vertical slice
        run: pnpm smoke
      - name: Smoke enterprise hardening
        run: pnpm smoke:enterprise
      - name: Smoke authz negatives
        run: pnpm smoke:authz

  production-env-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build config package
        run: pnpm --filter @agent-studio/config build
      - name: Reject unsafe production env
        run: node scripts/check-production-env.mjs

  # Boots the real production Compose stack (NODE_ENV=production, local runtime adapter
  # forbidden) and smokes it. The Claude adapter is pointed at a CI-only HTTP double so
  # the production path is exercised without provider credentials.
  production-stack:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml -f docker-compose.ci-prod.yml --env-file .env.production
      API_BASE_URL: http://localhost:4000
      CONTROL_PLANE_ORIGIN: http://localhost:3000
      AGENT_RUNTIME_ORIGIN: http://localhost:3001
      EMBED_RUNTIME_ORIGIN: http://localhost:3002
      METRICS_BEARER_TOKEN: ci-prod-metrics-bearer-token
      SMOKE_RUNTIME_PROVIDER: claude
      SMOKE_MODEL: claude-sonnet-4-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write .env.production
        run: |
          {
            echo 'POSTGRES_USER=agentstudio'
            echo 'POSTGRES_PASSWORD=ci-prod-postgres-password'
            echo 'POSTGRES_DB=agentstudio'
            echo 'BETTER_AUTH_SECRET=ci-prod-better-auth-secret-at-least-32-chars!!'
            echo 'SECRETS_MASTER_KEY=ci-prod-secrets-master-key-at-least-32-chars!!'
            echo 'METRICS_BEARER_TOKEN=ci-prod-metrics-bearer-token'
            echo 'DEFAULT_RUNTIME_PROVIDER=claude'
            echo 'ANTHROPIC_API_KEY=ci-double-key'
            echo 'API_BASE_URL=http://localhost:4000'
            echo 'BETTER_AUTH_URL=http://localhost:4000'
            echo 'NEXT_PUBLIC_API_BASE_URL=http://localhost:4000'
            echo 'CONTROL_PLANE_ORIGIN=http://localhost:3000'
            echo 'AGENT_RUNTIME_ORIGIN=http://localhost:3001'
            echo 'EMBED_RUNTIME_ORIGIN=http://localhost:3002'
            echo 'CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002'
            echo 'HTTPS_HOST_PORT=8443'
          } > .env.production
      - name: Build and start production stack
        run: $COMPOSE up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          $COMPOSE ps
          $COMPOSE logs --tail 200 api worker migrate
          exit 1
      - name: Assert production runtime contract
        run: |
          # The stack must be running in production mode with the local adapter disabled.
          $COMPOSE exec -T api printenv NODE_ENV | grep -qx production
          test "$($COMPOSE exec -T api printenv RUNTIME_ALLOW_LOCAL | tr -d '\r')" = "false"
          # The API image must not run as root.
          test "$($COMPOSE exec -T api id -u | tr -d '\r')" != "0"
      - name: Seed demo users (one-shot, development profile)
        run: $COMPOSE --profile demo run --rm seed
      - name: Smoke deploy
        run: node scripts/smoke-deploy.mjs
      - name: Smoke authz negatives
        run: node scripts/smoke-authz-negatives.mjs
      - name: Verify TLS front door
        run: curl -skf --resolve api.localhost:8443:127.0.0.1 https://api.localhost:8443/health
      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --tail 300
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
